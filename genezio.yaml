backend:
    functions:
        - entry: dev.api.js
          handler: handler
          name: express
          path: node-talent-ez/scripts
          type: httpServer
    language:
        name: js
        runtime: nodejs20.x
    path: ./
    scripts:
        deploy:
            - yarn install
            - yarn run api:dev
        local:
            - yarn install
            - yarn run api:dev
name: node-talent-ez
region: us-east-1
yamlVersion: 2
