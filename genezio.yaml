name: node-talent-ez
region: us-east-1
yamlVersion: 2
backend:
    functions:
        - entry: dev_api.js
          name: express
          path: scripts
          type: httpServer
    language:
        name: js
        runtime: nodejs20.x
        packageManager: npm
    path: ./
    scripts:
        deploy:
            - npm install
            - npm run api:build
        local:
            - npm run api:dev
